<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSwarm - سرب المقايضة الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#090d16] text-white font-sans">
    <nav class="flex justify-between items-center px-8 py-6 max-w-7xl mx-auto border-b border-gray-800/50">
        <div class="flex items-center space-x-2 space-x-reverse">
            <div class="w-4 h-4 rounded-full bg-cyan-400 animate-pulse"></div>
            <span class="text-xl font-bold tracking-wider bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                TechSwarm
            </span>
        </div>
        <button class="bg-cyan-500 hover:bg-cyan-400 text-black font-semibold px-5 py-2 rounded-full transition-all text-sm shadow-lg shadow-cyan-500/20">
            انضم لقائمة الانتظار
        </button>
    </nav>

    <section class="max-w-5xl mx-auto text-center px-6 pt-20 pb-16">
        <div class="inline-block mb-4 px-4 py-1.5 rounded-full border border-cyan-500/30 bg-cyan-500/10 text-cyan-400 text-xs font-medium tracking-wide">
            الجيل القادم من إعادة تداول الأجهزة الذكية 🚀
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold leading-tight tracking-tight mb-6">
            لا تبِع جهازك القديم، <br />
            <span class="bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-500 bg-clip-text text-transparent">
                بادله عبر سرب المقايضة الذكي
            </span>
        </h1>
        <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto mb-10">
            أول منصة تعتمد على الذكاء الاصطناعي وخوارزميات المطابقة الدائرية لتسهيل استبدال الأجهزة التقنية دون عناء البيع والشراء التقليدي.
        </p>

        <div class="bg-[#121826] p-4 rounded-2xl border border-gray-800 max-w-xl mx-auto shadow-2xl flex flex-col sm:flex-row gap-3">
            <input
                type="email"
                placeholder="أدخل بريدك الإلكتروني للانضمام..."
                class="bg-[#090d16] border border-gray-700/60 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 flex-grow text-sm text-right"
            />
            <button class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-bold px-6 py-3 rounded-xl transition-all text-sm whitespace-nowrap shadow-lg shadow-cyan-500/10">
                احجز مقعدك
            </button>
        </div>
    </section>

    <footer class="text-center py-8 text-gray-500 text-xs border-t border-gray-900 mt-20">
        © 2026 TechSwarm. جميع الحقوق محفوظة.
    </footer>
</body>
</html>
